<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Warm cream background -->
  <rect width="200" height="200" rx="38" fill="#F4F5E4"/>

  <!-- Subtle warm glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7B54" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FF7B54" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="38" fill="url(#glow)"/>

  <!-- First K — coral-orange, top-left, tilted -->
  <g transform="translate(72, 70) rotate(-8)"
     stroke="#FF7B54" stroke-width="11.5"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Spine -->
    <line x1="-18" y1="-28" x2="-18" y2="28"/>
    <!-- Upper arm -->
    <line x1="-18" y1="-1" x2="18" y2="-28"/>
    <!-- Lower arm -->
    <line x1="-18" y1="-1" x2="18" y2="28"/>
  </g>

  <!-- Second K — warm brown, bottom-right, same tilt, slightly smaller -->
  <g transform="translate(130, 132) rotate(-8)"
     stroke="#6B4226" stroke-width="9.5"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Spine -->
    <line x1="-15" y1="-23" x2="-15" y2="23"/>
    <!-- Upper arm -->
    <line x1="-15" y1="-1" x2="15" y2="-23"/>
    <!-- Lower arm -->
    <line x1="-15" y1="-1" x2="15" y2="23"/>
  </g>

  <!-- Whimsical accent dots -->
  <circle cx="150" cy="74" r="5.5" fill="#F4A261"/>
  <circle cx="58"  cy="134" r="3.5" fill="#E76F51" opacity="0.55"/>
</svg>
